name: incident-system
services:
  observability-storage:
    profiles: ['observability']
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    user: '0:0'
    command: ['sh', '-c', 'chown 10001:10001 /tempo /loki']
    volumes:
      - tempo-data:/tempo
      - loki-data:/loki
  tempo:
    profiles: ['observability']
    depends_on:
      observability-storage:
        condition: service_completed_successfully
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ['-config.file=/etc/tempo.yaml', '-target=all']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/lib/tempo
    ports:
      - '127.0.0.1:13200:3200'
  loki:
    profiles: ['observability']
    depends_on:
      observability-storage:
        condition: service_completed_successfully
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ['-config.file=/etc/loki.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/var/lib/loki
    ports:
      - '127.0.0.1:13100:3100'
  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: ['--config=/etc/otelcol.yaml']
    user: '0:0'
    volumes:
      - ./infra/observability/collector.yaml:/etc/otelcol.yaml:ro
      - ./local/runtime/logs:/var/log/incident-system:ro
      - collector-data:/var/lib/otelcol
    ports:
      - '127.0.0.1:14318:4318'
      - '127.0.0.1:13133:13133'
    depends_on: [tempo, loki]
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=3d', '--storage.tsdb.retention.size=512MB', '--query.max-samples=500000', '--query.timeout=10s']
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:19090:9090'
    depends_on: [otel-collector]
  grafana:
    profiles: ['observability']
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${INCIDENT_SYSTEM_GRAFANA_ADMIN_PASSWORD:?Set INCIDENT_SYSTEM_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:13000:3000'
    depends_on: [tempo, loki, prometheus]
  qstash:
    image: public.ecr.aws/upstash/qstash@sha256:2d447f3cdbe3d898eaffde21202632e0c20f58cce99c9d64716cc38f451baf32
    command: ['qstash', 'dev', '-port=8080', '-log-port=8081']
    ports:
      - '127.0.0.1:8081:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INCIDENT_SYSTEM_DATABASE_ADMIN_PASSWORD:?Set INCIDENT_SYSTEM_DATABASE_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      INCIDENT_SYSTEM_DATABASE_USER: ${INCIDENT_SYSTEM_DATABASE_USER:?Set INCIDENT_SYSTEM_DATABASE_USER}
      INCIDENT_SYSTEM_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_DATABASE_PASSWORD}
      INCIDENT_SYSTEM_DATABASE_NAME: ${INCIDENT_SYSTEM_DATABASE_NAME:?Set INCIDENT_SYSTEM_DATABASE_NAME}
      INCIDENT_SYSTEM_IDENTITY_DATABASE_NAME: ${INCIDENT_SYSTEM_IDENTITY_DATABASE_NAME:-incident_system_identity}
      INCIDENT_SYSTEM_IDENTITY_DATABASE_USER: ${INCIDENT_SYSTEM_IDENTITY_DATABASE_USER:-incident_system_identity}
      INCIDENT_SYSTEM_IDENTITY_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_IDENTITY_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_IDENTITY_DATABASE_PASSWORD}
      INCIDENT_SYSTEM_ORDER_DATABASE_NAME: ${INCIDENT_SYSTEM_ORDER_DATABASE_NAME:-incident_system_order}
      INCIDENT_SYSTEM_ORDER_DATABASE_USER: ${INCIDENT_SYSTEM_ORDER_DATABASE_USER:-incident_system_order}
      INCIDENT_SYSTEM_ORDER_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_ORDER_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_ORDER_DATABASE_PASSWORD}
      INCIDENT_SYSTEM_PAYMENT_DATABASE_NAME: ${INCIDENT_SYSTEM_PAYMENT_DATABASE_NAME:-incident_system_payment}
      INCIDENT_SYSTEM_PAYMENT_DATABASE_USER: ${INCIDENT_SYSTEM_PAYMENT_DATABASE_USER:-incident_system_payment}
      INCIDENT_SYSTEM_PAYMENT_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_PAYMENT_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_PAYMENT_DATABASE_PASSWORD}
      INCIDENT_SYSTEM_NOTIFICATION_DATABASE_NAME: ${INCIDENT_SYSTEM_NOTIFICATION_DATABASE_NAME:-incident_system_notification}
      INCIDENT_SYSTEM_NOTIFICATION_DATABASE_USER: ${INCIDENT_SYSTEM_NOTIFICATION_DATABASE_USER:-incident_system_notification}
      INCIDENT_SYSTEM_NOTIFICATION_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_NOTIFICATION_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_NOTIFICATION_DATABASE_PASSWORD}
    ports:
      - '127.0.0.1:${INCIDENT_SYSTEM_DATABASE_PORT:-55432}:5432'
    volumes:
      - database-data:/var/lib/postgresql
      - ./infra/database/init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 2s
      timeout: 3s
      retries: 15
  database-check:
    profiles: ['test']
    build: .
    environment:
      INCIDENT_SYSTEM_DATABASE_HOST: postgres
      INCIDENT_SYSTEM_DATABASE_PORT: '5432'
      INCIDENT_SYSTEM_DATABASE_NAME: ${INCIDENT_SYSTEM_DATABASE_NAME:?Set INCIDENT_SYSTEM_DATABASE_NAME}
      INCIDENT_SYSTEM_DATABASE_USER: ${INCIDENT_SYSTEM_DATABASE_USER:?Set INCIDENT_SYSTEM_DATABASE_USER}
      INCIDENT_SYSTEM_DATABASE_PASSWORD: ${INCIDENT_SYSTEM_DATABASE_PASSWORD:?Set INCIDENT_SYSTEM_DATABASE_PASSWORD}
      INCIDENT_SYSTEM_DATABASE_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  collector-data:
  grafana-data:
  database-data:
