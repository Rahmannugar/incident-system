extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [/var/log/incident-system/*.jsonl]
    start_at: beginning
    storage: file_storage
    include_file_name: false
    max_log_size: 32KiB
    max_concurrent_files: 64
    retry_on_failure:
      enabled: true
    operators:
      - type: json_parser
        parse_to: body
        timestamp:
          parse_from: body.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: copy
        from: body.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    metric_expiration: 20s
    translation_strategy: UnderscoreEscapingWithSuffixes
    without_scope_info: true
    resource_constant_labels:
      included: [service.name, process_role, source]
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 5s
    retry_on_failure:
      max_elapsed_time: 60s
    sending_queue:
      queue_size: 256
      storage: file_storage
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    retry_on_failure:
      max_elapsed_time: 60s
    sending_queue:
      queue_size: 256
      storage: file_storage

service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
