version: '2'
sql:
  - engine: postgresql
    schema: internal/orders/migrations
    queries: internal/orders/queries
    gen:
      go:
        package: orderdb
        out: internal/orders/generated
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
