[database]
host = {{ env "INCIDENT_SYSTEM_DATABASE_HOST" | default "127.0.0.1" }}
port = {{ env "INCIDENT_SYSTEM_DATABASE_PORT" | default "55432" }}
database = {{ env "INCIDENT_SYSTEM_IDENTITY_DATABASE_NAME" | default "incident_system_identity" }}
user = {{ env "INCIDENT_SYSTEM_IDENTITY_DATABASE_USER" | default "incident_system_identity" }}
password = {{ env "INCIDENT_SYSTEM_IDENTITY_DATABASE_PASSWORD" }}
sslmode = {{ env "INCIDENT_SYSTEM_DATABASE_SSL_MODE" | default "disable" }}
version_table = public.schema_version
