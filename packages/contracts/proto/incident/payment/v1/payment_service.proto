syntax = "proto3";
package incident.payment.v1;
option go_package = "github.com/Rahmannugar/incident-system/packages/contracts/gen/go/incident/payment/v1;paymentv1";

service PaymentService {
  rpc InitiatePayment(InitiatePaymentRequest) returns (InitiatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);
}
message Payment {
  string id = 1;
  string order_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string status = 5;
  int64 reservation_expires_at_unix_ms = 6;
  int64 created_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
  bool late = 9;
}
message InitiatePaymentRequest { string order_id = 1; }
message InitiatePaymentResponse { Payment payment = 1; }
message GetPaymentRequest { string order_id = 1; }
message GetPaymentResponse { Payment payment = 1; }
message CheckHealthRequest {}
message CheckHealthResponse { bool healthy = 1; }
