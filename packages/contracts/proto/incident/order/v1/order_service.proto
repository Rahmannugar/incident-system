syntax = "proto3";

package incident.order.v1;

option go_package = "github.com/Rahmannugar/incident-system/packages/contracts/gen/go/incident/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc PrepareOrderSettlement(PrepareOrderSettlementRequest) returns (PrepareOrderSettlementResponse);
  rpc FinalizeOrder(FinalizeOrderRequest) returns (FinalizeOrderResponse);
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);
}

message Order {
  string id = 1;
  string sku = 2;
  int32 quantity = 3;
  string status = 4;
  int64 created_at_unix = 5;
}

message CreateOrderRequest {
  string sku = 1;
  int32 quantity = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message CheckHealthRequest {}
message CheckHealthResponse {
  bool healthy = 1;
}

// Internal settlement operations require x-service-token.
message PrepareOrderSettlementRequest { string id = 1; string event_id = 2; string payload_hash = 3; }
message PrepareOrderSettlementResponse { Order order = 1; string payment_id = 2; }
message FinalizeOrderRequest {
  string id = 1;
  string event_id = 2;
  string payload_hash = 3;
  string payment_id = 4;
  string status = 5;
}
message FinalizeOrderResponse { Order order = 1; }
