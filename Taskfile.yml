version: '3'

dotenv: ['.env']

tasks:
  install:
    desc: Install locked Node dependencies and pinned Go tools
    cmds:
      - npm ci --ignore-scripts
      - task: tools
      - task: proto-tools
      - task: sqlc-tools

  tools:
    desc: Install the pinned Tern migration command
    status:
      - test -x bin/tern
    env:
      GOBIN: '{{.ROOT_DIR}}/bin'
    cmds:
      - go install github.com/jackc/tern/v2@v2.4.3

  db-up:
    desc: Start PostgreSQL and wait for readiness
    cmds:
      - docker compose up -d --wait postgres

  proto-tools:
    desc: Install pinned Go protobuf generators
    status:
      - test -x bin/protoc-gen-go
      - test -x bin/protoc-gen-go-grpc
    env:
      GOBIN: '{{.ROOT_DIR}}/bin'
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

  proto:
    desc: Validate protobuf contracts and generate Go and TypeScript code
    deps: [proto-tools]
    cmds:
      - node_modules/.bin/buf lint
      - node_modules/.bin/buf generate

  sqlc-tools:
    desc: Install the pinned SQLC generator
    status:
      - test -x bin/sqlc
    env:
      GOBIN: '{{.ROOT_DIR}}/bin'
    cmds:
      - go install -p 2 github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

  provision:
    desc: Provision missing databases and their non-superuser owners
    cmds:
      - docker compose exec -T postgres /bin/sh /docker-entrypoint-initdb.d/01-databases.sh

  down:
    desc: Stop containers and retain database data
    cmds:
      - docker compose down

  logs:
    desc: Follow container logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  migrate:
    desc: Apply versioned Tern migrations
    deps: [tools]
    cmds:
      - bin/tern migrate -c infra/database/tern.conf -m scripts/database/migrations
      - bin/tern migrate -c apps/identity/tern.conf -m apps/identity/src/auth/migrations
      - bin/tern migrate -c apps/order/tern.conf -m apps/order/internal/orders/migrations

  migrate:database:
    desc: Apply SQL acceptance schema migrations
    deps: [tools]
    cmds:
      - bin/tern migrate -c infra/database/tern.conf -m scripts/database/migrations

  generate:
    desc: Generate typed queries from the database
    cmds:
      - task: proto
      - task: generate:database
      - node --experimental-strip-types --env-file-if-exists=.env apps/identity/scripts/generate.ts
      - task: generate:order

  generate:order:
    desc: Generate Order query adapters with SQLC
    deps: [sqlc-tools]
    cmds:
      - bin/sqlc generate -f apps/order/sqlc.yaml

  generate:database:
    desc: Generate SQL acceptance query types
    cmds:
      - node --experimental-strip-types --env-file-if-exists=.env scripts/database/generate.ts

  typecheck:
    desc: Check TypeScript types
    cmds:
      - node node_modules/typescript/bin/tsc --noEmit

  test:
    desc: Compile and run persistence, authentication and order integration tests
    cmds:
      - node node_modules/typescript/bin/tsc
      - node --env-file-if-exists=.env --test --test-concurrency=1 dist/scripts/database/proof.test.js dist/apps/identity/test/identity.integration.test.js dist/apps/order/test/order.integration.test.js

  build:
    desc: Compile TypeScript, Gateway and Order
    cmds:
      - node node_modules/typescript/bin/tsc
      - go -C apps/gateway build -o ../../bin/gateway ./cmd/gateway
      - go -C apps/order build -o ../../bin/order ./cmd/order

  run-order:
    desc: Run the compiled Order service
    cmds:
      - node --experimental-strip-types --env-file-if-exists=.env scripts/services.ts order

  run-identity:
    desc: Run the compiled Identity service
    cmds:
      - node --experimental-strip-types --env-file-if-exists=.env scripts/services.ts identity

  run-gateway:
    desc: Run the compiled Gateway
    cmds:
      - node --experimental-strip-types --env-file-if-exists=.env scripts/services.ts gateway

  check:
    desc: Check TypeScript, Go, protobuf contracts, bootstrap, and Compose configuration
    cmds:
      - task: typecheck
      - go -C packages/contracts test ./...
      - go -C apps/gateway test ./...
      - go -C apps/gateway vet ./...
      - go -C apps/order test ./...
      - go -C apps/order vet ./...
      - node_modules/.bin/buf lint
      - sh -n infra/database/init.sh
      - docker compose --profile test config --quiet

  check-integration:
    desc: Start PostgreSQL, migrate, generate queries, and run database checks
    cmds:
      - task: db-up
      - task: provision
      - task: migrate
      - task: generate
      - task: build
      - task: check
      - task: test

  check-database:
    desc: Run SQL acceptance checks against an already running database
    cmds:
      - task: migrate:database
      - task: generate:database
      - node node_modules/typescript/bin/tsc -p scripts/database/tsconfig.json
      - node --env-file-if-exists=.env --test dist/scripts/database/proof.test.js
